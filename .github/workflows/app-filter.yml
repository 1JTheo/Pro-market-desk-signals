name: MultiAssetSignalPro score filter

# After every new Market Desk Pro signal, score all its pairs (Top 3, backup, Strength, Bias) with the
# MultiAssetSignalPro app and write appscore=/appfilter= lines into signals/latest.txt.
on:
  push:
    branches: [main]
    paths: ['signals/latest.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-filter
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this signal is already scored
        id: check
        run: |
          # a manual run (Actions tab -> Run workflow) always re-scores the current signal
          if [ "${{ github.event_name }}" = "push" ] && grep -q '^appfilter=done' signals/latest.txt; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check the access token
        if: steps.check.outputs.skip == 'false'
        env:
          MASP_TOKEN: ${{ secrets.MASP_TOKEN }}
        run: |
          if [ -z "$MASP_TOKEN" ]; then echo "::error::Secret MASP_TOKEN is missing (read access to 1JTheo/MultiAssetSignalPro)"; exit 1; fi

      - name: Check out MultiAssetSignalPro (private)
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: 1JTheo/MultiAssetSignalPro
          ref: Streamlit
          token: ${{ secrets.MASP_TOKEN }}
          path: masp

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: masp/requirements.txt

      - name: Install the app's requirements
        if: steps.check.outputs.skip == 'false'
        run: pip install -r masp/requirements.txt

      - name: Score all signal pairs
        if: steps.check.outputs.skip == 'false'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/app_filter.py

      - name: Commit the scores
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals/latest.txt signals/appscores.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "App scores for $(grep '^generated_utc=' signals/latest.txt | cut -d= -f2)"
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              git push origin HEAD:main && exit 0
            else
              # a newer signal arrived meanwhile; its own run will score it
              git rebase --abort || true; echo "Newer signal pushed - skipping"; exit 0
            fi
            sleep 5
          done
          exit 1
